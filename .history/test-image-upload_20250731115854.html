<!DOCTYPE html>
<html>
<head>
    <title>测试图片上传到 Cloudinary</title>
    <meta charset="utf-8">
</head>
<body>
    <h1>测试图片上传到 Cloudinary</h1>
    
    <div>
        <h2>商品图片上传测试</h2>
        <form id="productForm">
            <input type="file" id="productImage" accept="image/*">
            <button type="button" onclick="uploadProductImage()">上传商品图片</button>
        </form>
        <div id="productResult"></div>
    </div>

    <div style="margin-top: 30px;">
        <h2>文章图片上传测试</h2>
        <form id="articleForm">
            <input type="file" id="articleImage" accept="image/*">
            <button type="button" onclick="uploadArticleImage()">上传文章图片</button>
        </form>
        <div id="articleResult"></div>
    </div>

    <script>
        const API_BASE = 'http://192.168.99.45:8000/api/v1';

        async function uploadProductImage() {
            const fileInput = document.getElementById('productImage');
            const resultDiv = document.getElementById('productResult');
            
            if (!fileInput.files[0]) {
                alert('请选择文件');
                return;
            }

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            try {
                resultDiv.innerHTML = '<p>上传中...</p>';
                
                const response = await fetch(`${API_BASE}/admin/upload-image`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (result.success) {
                    resultDiv.innerHTML = `
                        <p style="color: green;">✅ 商品图片上传成功!</p>
                        <p><strong>URL:</strong> ${result.url}</p>
                        <p><strong>Public ID:</strong> ${result.public_id || 'N/A'}</p>
                        <img src="${result.url}" style="max-width: 300px; max-height: 200px;">
                    `;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">❌ 上传失败: ${result.message || result.error}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">❌ 请求失败: ${error.message}</p>`;
            }
        }

        async function uploadArticleImage() {
            const fileInput = document.getElementById('articleImage');
            const resultDiv = document.getElementById('articleResult');
            
            if (!fileInput.files[0]) {
                alert('请选择文件');
                return;
            }

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            try {
                resultDiv.innerHTML = '<p>上传中...</p>';
                
                const response = await fetch(`${API_BASE}/admin/articles/upload-image`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (result.success) {
                    resultDiv.innerHTML = `
                        <p style="color: green;">✅ 文章图片上传成功!</p>
                        <p><strong>URL:</strong> ${result.url}</p>
                        <p><strong>Public ID:</strong> ${result.public_id || 'N/A'}</p>
                        <img src="${result.url}" style="max-width: 300px; max-height: 200px;">
                    `;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">❌ 上传失败: ${result.message || result.error}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">❌ 请求失败: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
