# version: '3.8'
services:
  db:
    image: mariadb:10.6
    platform: linux/arm64/v8
    restart: always
    environment:
      MARIADB_DATABASE: yi_jia_xiang
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_USER: yi_jia_xiang_user
      MARIADB_PASSWORD: yi_jia_xiang_password_2024
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    image: yijiaxiang-arm64:0.0.1
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: yi_jia_xiang
      DB_USERNAME: yi_jia_xiang_user
      DB_PASSWORD: yi_jia_xiang_password_2024
      CLOUDINARY_URL: cloudinary://815926459439819:4wRbJUBxsfJdQCR1OZk_o4_fu94@daeb3goxf
      CLOUDINARY_CLOUD_NAME: daeb3goxf
      CLOUDINARY_API_KEY: 815926459439819
      CLOUDINARY_API_SECRET: 4wRbJUBxsfJdQCR1OZk_o4_fu94
    ports:
      - "8888:8000"
    working_dir: /var/www

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5180:5173"
    volumes:
      - ./frontend:/app
    working_dir: /app

volumes:
  db_data: 