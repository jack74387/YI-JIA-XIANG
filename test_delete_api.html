<!DOCTYPE html>
<html>
<head>
    <title>測試Cloudinary刪除API</title>
    <meta charset="utf-8">
</head>
<body>
    <h1>測試Cloudinary刪除API</h1>
    
    <div style="margin: 20px;">
        <h2>通過Public ID刪除</h2>
        <input type="text" id="publicId" placeholder="輸入public_id" style="width: 300px;">
        <button onclick="deleteByPublicId()">刪除</button>
        <div id="result1"></div>
    </div>

    <script>
        // 設置API基礎URL
        const API_BASE = 'http://localhost:8000/api/v1';
        
        // 獲取token（假設你已經登入）
        const token = localStorage.getItem('auth_token');
        
        async function deleteByPublicId() {
            const publicId = document.getElementById('publicId').value;
            if (!publicId) {
                alert('請輸入public_id');
                return;
            }
            
            try {
                console.log('發送刪除請求，public_id:', publicId);
                
                const response = await fetch(`${API_BASE}/admin/delete-cloudinary-by-id`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        public_id: publicId
                    })
                });
                
                const data = await response.json();
                console.log('API響應:', data);
                
                document.getElementById('result1').innerHTML = 
                    `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                    
                if (data.success) {
                    alert('刪除成功！');
                } else {
                    alert('刪除失敗：' + data.message);
                }
                
            } catch (error) {
                console.error('請求失敗:', error);
                document.getElementById('result1').innerHTML = 
                    `<div style="color: red;">錯誤: ${error.message}</div>`;
            }
        }
        
        // 顯示當前token狀態
        if (token) {
            console.log('已找到認證token');
        } else {
            console.warn('未找到認證token，請先登入管理後台');
            alert('請先登入管理後台');
        }
    </script>
</body>
</html>
